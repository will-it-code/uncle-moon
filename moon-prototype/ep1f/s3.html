<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="../vendor/p5.min.js"></script>
<script src="../vendor/gsap.min.js"></script>
<script src="../cast/common.js"></script>
<script src="../cast/painterly.js"></script>
<script src="../cast/uncle-moon.js"></script>
<script src="../cast/pippa.js"></script>
<script src="../cast/scenery.js"></script>
<script src="bg.js"></script>
<style>
  html,body{margin:0;padding:0;background:#04060f;overflow:hidden}
  #gl{position:fixed;left:0;top:0;width:1280px;height:720px;z-index:0}
  canvas.p5Canvas{position:fixed;left:0;top:0;z-index:1}
</style>
</head><body>
<canvas id="gl" width="1280" height="720"></canvas>
<script>
// Ep1F S3_WORRY (30s): Pippa perches on a leaf, her glow faltering.
const W = 1280, H = 720, DUR = 30;
let tl;
const S = { blink: 1, glow: 1, tilt: 0 };

function setup() {
  createCanvas(W, H); pixelDensity(1);
  initBG('meadow');
  tl = gsap.timeline({ paused: true });
  tl.to(S, { glow: 0.35, duration: DUR, ease: "sine.inOut" }, 0); // dimming
  tl.to(S, { tilt: 0.18, duration: DUR, ease: "sine.inOut" }, 0); // droop
  for (const bt of [7, 18]) {
    tl.to(S, { blink: 0.15, duration: 0.12 }, bt);
    tl.to(S, { blink: 1, duration: 0.18 }, bt + 0.12);
  }
  window.__seek = (t) => {
    tl.seek(t);
    paintBG(t);
    draw(t);
    window.__frameReady = true;
  };
  window.__frameReady = true;
  noLoop();
}

function draw(t) {
  if (t === undefined || !isFinite(t)) return;
  resetMatrix();
  clear();
  const ctx = drawingContext;
  drawCastle(this, 330, 472, 0.9, t, {});
  drawUncleMoon(this, 180, 150, 0.45, t,
    { breath: 0, blink: S.blink, expression: "gentle" });
  // a broad leaf she rests on, swaying gently
  const sway = Math.sin(t * 0.5) * 6;
  ctx.save();
  ctx.translate(640 + sway, 620);
  ctx.rotate(-0.12 + Math.sin(t * 0.5) * 0.02);
  ctx.fillStyle = "rgb(52,110,88)";
  ctx.beginPath(); ctx.ellipse(0, 0, 90, 26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(70,55,45,0.8)"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(0, 0, 90, 26, 0, 0, Math.PI * 2); ctx.stroke();
  grainOver(ctx, 0, 0, 90, 26, 0.08);
  ctx.restore();
  // glow flickers uneasily as it dims
  const flick = 0.85 + 0.15 * Math.sin(t * 7.0) * Math.sin(t * 3.1);
  const face = Object.assign({}, PIPPA_EXPRESSIONS.sleepy);
  push(); translate(640 + sway, 588); rotate(S.tilt);
  drawPippa(this, 0, 0, 1.4, t, { blink: S.blink, expression: face, glow: S.glow * flick });
  pop();
  drawGrassField(this, t, 201, 745, 55, 60, 110, 1);
  drawNightFlowers(this, t, 202, 12, 725);
}
</script>
</body></html>
