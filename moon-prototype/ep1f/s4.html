<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="../vendor/p5.min.js"></script>
<script src="../vendor/gsap.min.js"></script>
<script src="../cast/common.js"></script>
<script src="../cast/painterly.js"></script>
<script src="../cast/uncle-moon.js"></script>
<script src="../cast/pippa.js"></script>
<script src="../cast/bird.js"></script>
<script src="../cast/scenery.js"></script>
<script src="bg.js"></script>
<style>
  html,body{margin:0;padding:0;background:#04060f;overflow:hidden}
  #gl{position:fixed;left:0;top:0;width:1280px;height:720px;z-index:0}
  canvas.p5Canvas{position:fixed;left:0;top:0;z-index:1}
</style>
</head><body>
<canvas id="gl" width="1280" height="720"></canvas>
<script>
// Ep1F S4_BIRD (25s): the old oak, Bibi crying, Pippa's steady glow.
const W = 1280, H = 720, DUR = 25;
let tl;
const S = { blink: 1, glow: 0.8, pippaY: 0, bibiY: 0 };

function setup() {
  createCanvas(W, H); pixelDensity(1);
  initBG('meadow');
  tl = gsap.timeline({ paused: true });
  // Bibi trembles, then settles as Pippa glows
  tl.to(S, { bibiY: -6, duration: 8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
  tl.to(S, { bibiY: 0, duration: 12, ease: "sine.inOut" }, 10); // calmed
  tl.to(S, { pippaY: -14, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
  for (const bt of [6, 16]) {
    tl.to(S, { blink: 0.15, duration: 0.12 }, bt);
    tl.to(S, { blink: 1, duration: 0.18 }, bt + 0.12);
  }
  window.__seek = (t) => {
    tl.seek(t);
    paintBG(t);
    draw(t);
    window.__frameReady = true;
  };
  window.__frameReady = true;
  noLoop();
}

function draw(t) {
  if (t === undefined || !isFinite(t)) return;
  resetMatrix();
  clear();
  const ctx = drawingContext;
  drawCastle(this, 1050, 500, 0.7, t, {});
  // the story tree on the left edge, built to hold the nest
  const tip = drawStoryTree(this, 150, 760, 1.3, t, {});
  // nest of twigs at the branch tip
  const nrnd = castMulberry32(44);
  ctx.save();
  ctx.translate(tip.bx, tip.by + 6);
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const nx = 58 * Math.cos(a), ny = 24 * Math.sin(a);
    const wob = (nrnd() - 0.5) * 10;
    ctx.strokeStyle = `rgb(${105 + nrnd() * 35|0},${75 + nrnd() * 22|0},${50 + nrnd() * 16|0})`;
    ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(nx - 20, ny - 6 + wob); ctx.lineTo(nx + 20, ny + 6 + wob);
    ctx.stroke();
  }
  ctx.fillStyle = "rgba(38,26,18,0.9)";
  ctx.beginPath(); ctx.ellipse(0, -2, 40, 15, 0, 0, Math.PI * 2); ctx.fill();
  grainOver(ctx, 0, 0, 62, 28, 0.08);
  ctx.restore();
  // Bibi nestled IN the nest
  drawBird(this, tip.bx, tip.by - 32 + S.bibiY, 1.45, t, { blink: S.blink });
  // Pippa hovers beside the nest, glowing soft and steady
  const face = Object.assign({}, PIPPA_EXPRESSIONS.gentle);
  drawPippa(this, tip.bx + 220, tip.by - 20 + S.pippaY, 1.4, t,
    { blink: S.blink, expression: face, glow: S.glow });
  // Uncle Moon watches over, every frame
  drawUncleMoon(this, 1060, 150, 0.45, t,
    { breath: 0, blink: S.blink, expression: "gentle" });
  drawGrassField(this, t, 201, 745, 55, 60, 110, 1);
  drawNightFlowers(this, t, 202, 12, 725);
}
</script>
</body></html>
