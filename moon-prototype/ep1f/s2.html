<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="../vendor/p5.min.js"></script>
<script src="../vendor/gsap.min.js"></script>
<script src="../cast/common.js"></script>
<script src="../cast/painterly.js"></script>
<script src="../cast/uncle-moon.js"></script>
<script src="../cast/pippa.js"></script>
<script src="../cast/scenery.js"></script>
<script src="bg.js"></script>
<style>
  html,body{margin:0;padding:0;background:#04060f;overflow:hidden}
  #gl{position:fixed;left:0;top:0;width:1280px;height:720px;z-index:0}
  canvas.p5Canvas{position:fixed;left:0;top:0;z-index:1}
</style>
</head><body>
<canvas id="gl" width="1280" height="720"></canvas>
<script>
// Ep1F S2_MEADOW (60s): Pippa drifts over the painterly meadow, sharing glow.
const W = 1280, H = 720, DUR = 60;
let tl;
const S = { px: 300, py: 480, blink: 1, glow: 1 };

const flies = [];
{
  const rnd = castMulberry32(5);
  for (let i = 0; i < 10; i++) {
    flies.push({ x: 80 + rnd() * 1120, y: 430 + rnd() * 180,
                 ph: rnd() * 6.28, r: 22 + rnd() * 14 });
  }
}

function setup() {
  createCanvas(W, H); pixelDensity(1);
  initBG('meadow');
  tl = gsap.timeline({ paused: true });
  // Pippa wanders slowly across the meadow (py is pure f(t) in draw)
  tl.to(S, { px: 980, duration: DUR, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
  for (const bt of [9, 27, 44]) {
    tl.to(S, { blink: 0.15, duration: 0.12 }, bt);
    tl.to(S, { blink: 1, duration: 0.18 }, bt + 0.12);
  }
  window.__seek = (t) => {
    tl.seek(t);
    paintBG(t);
    draw(t);
    window.__frameReady = true;
  };
  window.__frameReady = true;
  noLoop();
}

function draw(t) {
  if (t === undefined || !isFinite(t)) return;
  resetMatrix();
  clear();
  const ctx = drawingContext;
  drawCastle(this, 330, 472, 0.9, t, {});
  drawUncleMoon(this, 1080, 150, 0.45, t,
    { breath: 0, blink: S.blink, expression: "gentle" });
  drawTreeDetailed(this, 1075, 640, 1.2, t, {});
  for (const f of flies) {
    const fx = f.x + 26 * Math.sin(t * 0.45 + f.ph);
    const fy = f.y + 16 * Math.sin(t * 0.7 + f.ph * 2.0);
    const tw = 0.55 + 0.45 * Math.sin(t * 1.8 + f.ph * 3.0);
    castRadialGlow(this, fx, fy, f.r * tw, [255, 214, 130], 0.5 * tw);
    ctx.fillStyle = `rgba(255,226,160,${0.9 * tw})`;
    ctx.beginPath(); ctx.arc(fx, fy, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  const face = Object.assign({}, PIPPA_EXPRESSIONS.happy);
  const py = 480 + 60 * Math.sin(t * 0.35);
  drawPippa(this, S.px, py, 1.5, t, { blink: S.blink, expression: face, glow: S.glow });
  drawGrassField(this, t, 201, 745, 55, 60, 110, 1);
  drawNightFlowers(this, t, 202, 12, 725);
}
</script>
</body></html>
