<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="../vendor/p5.min.js"></script>
<script src="../vendor/gsap.min.js"></script>
<script src="../cast/common.js"></script>
<script src="../cast/painterly.js"></script>
<script src="../cast/uncle-moon.js"></script>
<script src="../cast/pippa.js"></script>
<script src="../cast/turtle.js"></script>
<script src="../cast/scenery.js"></script>
<script src="bg.js"></script>
<style>
  html,body{margin:0;padding:0;background:#04060f;overflow:hidden}
  #gl{position:fixed;left:0;top:0;width:1280px;height:720px;z-index:0}
  canvas.p5Canvas{position:fixed;left:0;top:0;z-index:1}
</style>
</head><body>
<canvas id="gl" width="1280" height="720"></canvas>
<script>
// Ep1F S5_TURTLE (25s): the pond, Tommy lost, Pippa guides him home.
const W = 1280, H = 720, DUR = 25;
let tl;
const S = { tommyX: 420, pippaX: 300, pippaY: 420, blink: 1, glow: 0.6 };

const reeds = [];
{
  const rnd = castMulberry32(77);
  for (let i = 0; i < 14; i++) {
    reeds.push({ x: 60 + rnd() * 1160, h: 90 + rnd() * 70, ph: rnd() * 6.28 });
  }
}

function setup() {
  createCanvas(W, H); pixelDensity(1);
  initBG('pond');
  tl = gsap.timeline({ paused: true });
  // Tommy lumbers home across the pond edge; Pippa zips ahead like a lantern
  tl.to(S, { tommyX: 900, duration: DUR, ease: "sine.inOut" }, 0);
  tl.to(S, { pippaX: 950, duration: DUR, ease: "sine.inOut" }, 0);
  for (const bt of [8, 17]) {
    tl.to(S, { blink: 0.15, duration: 0.12 }, bt);
    tl.to(S, { blink: 1, duration: 0.18 }, bt + 0.12);
  }
  window.__seek = (t) => {
    tl.seek(t);
    paintBG(t);
    draw(t);
    window.__frameReady = true;
  };
  window.__frameReady = true;
  noLoop();
}

function draw(t) {
  if (t === undefined || !isFinite(t)) return;
  resetMatrix();
  clear();
  const ctx = drawingContext;
  // reed silhouettes along the pond edge
  ctx.fillStyle = "rgba(18,32,44,0.9)";
  for (const r of reeds) {
    const sx = Math.sin(t * 0.6 + r.ph) * 5;
    ctx.save(); ctx.translate(r.x, 720);
    ctx.rotate(sx * 0.01);
    ctx.beginPath();
    ctx.moveTo(-7, 0); ctx.quadraticCurveTo(-4, -r.h * 0.6, 0, -r.h);
    ctx.quadraticCurveTo(4, -r.h * 0.6, 7, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  drawTurtle(this, S.tommyX, 620, 1.3, t, { blink: S.blink });
  drawUncleMoon(this, 1080, 150, 0.45, t,
    { breath: 0, blink: S.blink, expression: "gentle" });
  const py = S.pippaY + 40 * Math.sin(t * 1.1);
  const face = Object.assign({}, PIPPA_EXPRESSIONS.happy);
  drawPippa(this, S.pippaX, py, 1.3, t,
    { blink: S.blink, expression: face, glow: S.glow });
}
</script>
</body></html>
