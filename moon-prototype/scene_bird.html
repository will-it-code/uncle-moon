<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ep1 Scene — Baby Bird (Pippa shares her light)</title>
<!--
  EP1 SCENE 1/5 · baby bird · 97 frames (~4.0s)
  A twig nest on a branch at night. A baby bird sits trembling, afraid of
  the dark. Pippa flies in from the right; her warm glow washes over the
  nest and the bird relaxes into cozy happy eyes.

  Deterministic: ?t=SECONDS renders one still frame (byte-identical).
  Add ?clean=1 to hide the hint.
-->
<script src="vendor/p5.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #070818; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #hint { position: fixed; left: 12px; bottom: 10px; color: #8f93c9;
    font: 12px/1.5 system-ui, sans-serif; opacity: .75; user-select: none; }
</style>
</head>
<body>
<div id="hint">scene: baby bird — add <b>?t=1.1</b> for a still frame</div>
<script>
"use strict";

/* ================= CONFIG ================= */
const W = 1280, H = 720;
const SEED = 20261021;
const GLOW = [255, 214, 130];
const NEST = { x: 640, y: 470 };
const SKY_STOPS = [
  [0.00, [  7,   8,  24]],
  [0.45, [ 18,  21,  58]],
  [0.75, [ 36,  29,  94]],
  [1.00, [ 59,  42, 114]],
];

/* ================= SEEDED RNG ================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(SEED);
const rr = (lo, hi) => lo + rng() * (hi - lo);

/* ================= TIME ================= */
const PARAMS = new URLSearchParams(location.search);
const T_FIXED = PARAMS.has("t") ? parseFloat(PARAMS.get("t")) : null;
if (PARAMS.has("clean")) document.getElementById("hint").style.display = "none";
const nowT = () => (T_FIXED !== null ? T_FIXED : millis() / 1000);
const sstep = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };

/* ================= WORLD ================= */
let stars = [], twigs = [];
let skyGrad = null;
function buildWorld() {
  for (let i = 0; i < 150; i++)
    stars.push({ x: rr(0, W), y: rr(0, H * 0.75), r: rr(0.6, 2.4),
      baseA: rr(0.2, 0.9), speed: rr(0.4, 2.0), phase: rr(0, Math.PI * 2) });
  for (let i = 0; i < 16; i++)   // woven twig arcs for the nest bowl
    twigs.push({ a0: rr(0.15, 0.5), a1: rr(2.6, 3.0), w: rr(150, 190),
                 h: rr(46, 62), yj: rr(-6, 6), tone: rr(0, 1) });
}

/* ================= HELPERS ================= */
function linGrad(x0, y0, x1, y1, stops) {
  const g = drawingContext.createLinearGradient(x0, y0, x1, y1);
  for (const [o, c] of stops) g.addColorStop(o, `rgb(${c[0]},${c[1]},${c[2]})`);
  return g;
}
function radialGlow(x, y, r, rgb, alpha) {
  const ctx = drawingContext;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0.0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`);
  g.addColorStop(0.55, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha * 0.45})`);
  g.addColorStop(1.0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
// Pippa's flight: off-screen right -> hover above-left of the nest
function pippaPos(t) {
  const k = sstep(0, 1.2, t);
  const x = (W + 80) * (1 - k) + (NEST.x - 170) * k;
  const y = 180 * (1 - k) + (NEST.y - 190) * k + 12 * Math.sin(Math.PI * 2 * t / 1.7) * k;
  return { x, y };
}

/* ================= P5 LIFECYCLE ================= */
function setup() {
  createCanvas(W, H);
  pixelDensity(1);
  buildWorld();
  skyGrad = linGrad(0, 0, 0, H, SKY_STOPS);
}

function draw() {
  const t = nowT();
  const ctx = drawingContext;
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
  drawStars(t);
  drawBranch();
  drawNestGlow(t);
  drawNest();
  drawBird(t);
  drawPippa(t);
  drawVignette();
  window.__frameReady = true;
  if (T_FIXED !== null) noLoop();
}

function drawStars(t) {
  noStroke();
  for (const s of stars) {
    const tw = 0.55 + 0.45 * Math.sin(Math.PI * 2 * t * s.speed + s.phase);
    drawingContext.fillStyle = `rgba(255,255,255,${(s.baseA * tw).toFixed(3)})`;
    drawingContext.beginPath(); drawingContext.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    drawingContext.fill();
  }
}

function drawBranch() {
  // thick branch sweeping in from the left to the nest
  noFill();
  stroke(74, 52, 38); strokeWeight(46); strokeCap(ROUND);
  bezier(-40, 560, 220, 540, 420, 520, NEST.x - 40, NEST.y + 46);
  stroke(92, 66, 48); strokeWeight(30);
  bezier(-40, 552, 220, 532, 420, 512, NEST.x - 40, NEST.y + 38);
  // small offshoot twigs
  stroke(74, 52, 38); strokeWeight(10);
  bezier(300, 528, 340, 470, 380, 440, 420, 428);
  noStroke();
}

function drawNestGlow(t) {
  // Pippa's warm light washing over the nest once she arrives
  const wash = sstep(1.0, 1.9, t);
  if (wash <= 0) return;
  const pulse = 0.75 + 0.25 * Math.sin((Math.PI * 2 * t) / 2.2);
  radialGlow(NEST.x, NEST.y - 30, 300, GLOW, 0.34 * wash * pulse);
}

function drawNest() {
  const { x, y } = NEST;
  noFill();
  for (const tw of twigs) {   // woven bowl
    stroke(96 + tw.tone * 40, 66 + tw.tone * 26, 44, 255);
    strokeWeight(7);
    arc(x, y + tw.yj, tw.w, tw.h, tw.a0, tw.a1);
  }
  noStroke();
  fill(52, 36, 26, 255);      // soft inner lining
  ellipse(x, y - 6, 150, 44);
}

function drawBird(t) {
  const calm = sstep(1.2, 2.6, t);          // 0 = afraid, 1 = cozy
  const tremble = 2.6 * (1 - calm);
  const bx = NEST.x + tremble * Math.sin(t * 28);
  const by = NEST.y - 78 + tremble * 0.6 * Math.cos(t * 31);
  const breathe = 1 + 0.02 * Math.sin((Math.PI * 2 * t) / 2.8);

  push();
  translate(bx, by);
  scale(breathe, 2 - breathe);

  // fluffy round body
  const ctx = drawingContext;
  const bg = ctx.createRadialGradient(-14, -18, 8, 0, 0, 62);
  bg.addColorStop(0, "rgb(150,168,198)");
  bg.addColorStop(1, "rgb(104,120,150)");
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(0, 0, 56, 0, Math.PI * 2); ctx.fill();
  // feather tufts
  noStroke(); fill(150, 168, 198);
  triangle(-18, -50, -6, -50, -12, -70);
  triangle(2, -54, 14, -54, 8, -74);
  triangle(-34, -34, -24, -40, -44, -48);
  // tiny wings tucked
  fill(104, 120, 150);
  ellipse(-44, 10, 30, 44);
  ellipse(44, 10, 30, 44);

  // eyes: wide with fear -> soft happy arcs
  const ew = 30, ex = 24, ey = -12;
  noStroke();
  fill(255, 255, 255);
  circle(-ex, ey, ew * 2); circle(ex, ey, ew * 2);
  const look = 4 * Math.sin((Math.PI * 2 * t) / 2.1);   // darting glances while afraid
  fill(40, 38, 54);
  const pr = 10 - 3 * calm;
  circle(-ex + look * (1 - calm), ey + 2, pr * 2);
  circle(ex + look * (1 - calm), ey + 2, pr * 2);
  fill(255, 255, 255);
  circle(-ex - 3 + look * (1 - calm), ey - 1, 5);
  circle(ex - 3 + look * (1 - calm), ey - 1, 5);
  // happy lids slide in as she relaxes
  if (calm > 0) {
    fill(104, 120, 150);
    arc(-ex, ey, ew * 2 + 4, ew * 2 + 4, Math.PI, Math.PI * 2);
    arc(ex, ey, ew * 2 + 4, ew * 2 + 4, Math.PI, Math.PI * 2);
    noFill(); stroke(70, 62, 80); strokeWeight(4); strokeCap(ROUND);
    arc(-ex, ey + 2, 26, 20, Math.PI * 1.1, Math.PI * 1.9);
    arc(ex, ey + 2, 26, 20, Math.PI * 1.1, Math.PI * 1.9);
    noStroke();
  }
  // beak: slightly open when afraid -> tiny smile
  fill(240, 170, 90);
  if (calm < 0.5) {
    triangle(-10, 22, 10, 22, 0, 34 + 6 * (1 - calm));
  } else {
    noFill(); stroke(200, 140, 70); strokeWeight(4); strokeCap(ROUND);
    arc(0, 24, 20, 14, Math.PI * 0.15, Math.PI * 0.85);
    noStroke();
  }
  // rosy cheeks
  radialGlow(-34, 16, 9, [255, 150, 150], 0.45);
  radialGlow(34, 16, 9, [255, 150, 150], 0.45);
  pop();
}

// Pippa rig (same design as her prototype), flying in to help
function drawPippa(t) {
  const p = pippaPos(t);
  const pulse = 0.72 + 0.28 * Math.sin((Math.PI * 2 * t) / 2.2);
  radialGlow(p.x, p.y, 150 * pulse + 40, GLOW, 0.30 * pulse);
  radialGlow(p.x, p.y, 70, GLOW, 0.45 * pulse);
  push();
  translate(p.x, p.y);
  rotate(0.12 * Math.sin((Math.PI * 2 * t) / 3.6));
  const flap = Math.sin(Math.PI * 2 * t * 6.0) * 0.45;
  noStroke();
  for (const s of [-1, 1]) {
    push(); translate(s * 10, -18); rotate(s * (0.5 + flap * 0.6));
    fill(235, 242, 255, 90); ellipse(s * 16, -14, 44, 20);
    fill(255, 255, 255, 60); ellipse(s * 16, -14, 30, 12);
    pop();
  }
  const ctx = drawingContext;
  const bg = ctx.createRadialGradient(-8, -10, 4, 0, 0, 30);
  bg.addColorStop(0, "rgb(74,66,92)");
  bg.addColorStop(1, "rgb(52,46,64)");
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
  radialGlow(4, 12, 20 * pulse + 6, GLOW, 0.85);
  fill(255, 226, 150, 235);
  ellipse(4, 12, 22 * pulse + 8, 16 * pulse + 6);
  const gx = 5 * Math.sin((Math.PI * 2 * t) / 3.1);
  const gy = 3 * Math.cos((Math.PI * 2 * t) / 2.3);
  noStroke(); fill(255, 255, 255);
  circle(-11, -8, 26); circle(13, -8, 26);
  fill(40, 34, 52);
  circle(-11 + gx, -8 + gy, 12); circle(13 + gx, -8 + gy, 12);
  fill(255, 255, 255);
  circle(-13 + gx, -10 + gy, 4); circle(11 + gx, -10 + gy, 4);
  noFill(); stroke(70, 58, 78); strokeWeight(3); strokeCap(ROUND);
  arc(1, 6, 16, 12, Math.PI * 0.2, Math.PI * 0.8);
  noStroke();
  radialGlow(-20, 4, 7, [255, 150, 150], 0.5);
  radialGlow(22, 4, 7, [255, 150, 150], 0.5);
  pop();
}

function drawVignette() {
  const ctx = drawingContext;
  const g = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.95);
  g.addColorStop(0, "rgba(4,5,16,0)");
  g.addColorStop(1, "rgba(4,5,16,0.45)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}
</script>
</body>
</html>
