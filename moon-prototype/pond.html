<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="vendor/p5.min.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="cast/common.js"></script>
<style>
  html,body{margin:0;padding:0;background:#04060f;overflow:hidden}
  #gl{position:fixed;left:0;top:0;width:1280px;height:720px;z-index:0}
  canvas.p5Canvas{position:fixed;left:0;top:0;z-index:1}
</style>
</head><body>
<canvas id="gl" width="1280" height="720"></canvas>
<script>
// Pond water scene (screenshot review): a living GLSL pond — ripple
// normals distort the reflected sky, the moon lays a shimmering column.
// Reeds + lily pads drawn in p5 above. All motion from uTime (seek-exact).
const W = 1280, H = 720;
let gl, uTimeLoc, tl;

const FRAG = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1.0,0.0)), u.x),
             mix(hash(i+vec2(0.0,1.0)), hash(i+vec2(1.0,1.0)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for(int i=0;i<4;i++){ v += a*noise(p); p = p*2.03 + vec2(17.3,9.1); a *= 0.5; }
  return v;
}
vec3 skyRef(vec2 uv){
  vec3 col = mix(vec3(0.016,0.024,0.059), vec3(0.082,0.125,0.290), pow(clamp(uv.y,0.0,1.0), 1.25));
  float band = exp(-pow((uv.y - 0.55)*3.0, 2.0));
  col += vec3(0.09,0.08,0.15) * band;
  return col;
}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = uv; p.x *= uRes.x / uRes.y;
  float t = uTime * 0.05;

  // ripple normal: layered sines + drifting fbm micro-ripples
  vec2 rip;
  rip.x = sin(p.x*8.0 + t*1.2)*0.5 + sin(p.x*17.0 - t*0.8 + p.y*6.0)*0.3;
  rip.y = cos(p.y*10.0 - t*1.0)*0.5 + cos((p.x+p.y)*13.0 + t*0.6)*0.3;
  float micro = fbm(p*6.0 + vec2(t*0.3, -t*0.2)) - 0.5;
  vec2 n = vec2(rip.x, rip.y)*0.5 + vec2(micro, -micro)*0.8;

  // reflected sky, distorted by the ripples
  vec2 ruv = vec2(uv.x + n.x*0.035, 1.0 - uv.y*0.85 + n.y*0.02);
  vec3 refle = skyRef(ruv);

  // water body: luminous deep teal, darker toward the viewer
  vec3 deep = mix(vec3(0.030,0.135,0.175), vec3(0.010,0.065,0.115), uv.y);

  // distance reflectivity: far water mirrors the sky
  float fres = pow(1.0 - uv.y, 1.5)*0.7 + 0.3;
  vec3 col = mix(deep, refle, fres*0.62);

  // drifting ripple flecks: sparse bright dashes catching the light
  float fleck = fbm(p*13.0 + vec2(t*0.55, t*0.32));
  fleck = smoothstep(0.60, 0.78, fleck);
  col += vec3(0.55,0.75,0.95) * fleck * 0.22;

  // moon glint: a soft shimmering path of warm light (gentle, irregular)
  float mx = 0.68;
  float dx = uv.x - mx + n.x*0.030;
  float core = exp(-pow(dx*26.0, 2.0));
  float aura = exp(-pow(dx*9.0, 2.0))*0.35;
  float breathe = 0.72 + 0.28*sin(uv.y*22.0 + uTime*1.6 + n.y*8.0);
  float vband = smoothstep(0.05, 0.35, uv.y) * (1.0 - smoothstep(0.72, 0.97, uv.y));
  col += vec3(1.0, 0.82, 0.55) * (core*0.55 + aura) * breathe * vband * 0.62;

  // sparkles, only inside the moon path's aura
  vec2 sp = p * 60.0;
  vec2 cell = floor(sp);
  float h = hash(cell);
  if(h > 0.985){
    vec2 spos = vec2(hash(cell+3.1), hash(cell+7.7)) - 0.5;
    float d = length(fract(sp) - 0.5 - spos*0.5 + n*0.3);
    float tw = 0.5 + 0.5*sin(uTime*3.0 + h*50.0);
    float nearPath = exp(-pow((uv.x - mx)*9.0, 2.0));
    col += vec3(1.0,0.9,0.7) * smoothstep(0.06, 0.0, d) * tw * nearPath * 2.0;
  }

  float vig = smoothstep(1.30, 0.40, length(uv-0.5)*1.45);
  col *= mix(0.70, 1.0, vig);
  gl_FragColor = vec4(col, 1.0);
}`;
const VERT = `attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

function initGL() {
  const cv = document.getElementById('gl');
  gl = cv.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });
  function sh(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(pr); gl.useProgram(pr);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(gl.getUniformLocation(pr, 'uRes'), W, H);
  uTimeLoc = gl.getUniformLocation(pr, 'uTime');
  gl.viewport(0, 0, W, H);
}

// reeds and lily pads, deterministic placement
const reeds = [];
{
  const rnd = castMulberry32(7);
  for (const bx of [40, 90, 1220, 1260, 1180]) {
    const n = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
      reeds.push({ x: bx + (rnd() - 0.5) * 50, h: 130 + rnd() * 120,
                   ph: rnd() * 6.28, lean: (rnd() - 0.5) * 0.3 });
    }
  }
}
const pads = [];
{
  const rnd = castMulberry32(21);
  for (let i = 0; i < 7; i++) {
    pads.push({ x: 200 + rnd() * 880, y: 430 + rnd() * 220,
                r: 26 + rnd() * 30, ph: rnd() * 6.28 });
  }
}

function setup() {
  createCanvas(W, H); pixelDensity(1);
  initGL();
  tl = gsap.timeline({ paused: true });
  window.__seek = (t) => {
    tl.seek(t);
    gl.uniform1f(uTimeLoc, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    draw(t);
    window.__frameReady = true;
  };
  window.__frameReady = true;
  noLoop();
}

function draw(t) {
  if (t === undefined || !isFinite(t)) return;
  resetMatrix();
  clear();
  const ctx = drawingContext;

  // lily pads: dark, sitting IN the water — soft shadow beneath each,
  // gentle top-light, bobbing almost imperceptibly
  for (const pd of pads) {
    const py = pd.y + 3 * Math.sin(t * 0.6 + pd.ph);
    // shadow on the water
    ctx.save(); ctx.globalCompositeOperation = "multiply";
    ctx.fillStyle = "rgba(10,30,35,0.45)";
    ctx.beginPath(); ctx.ellipse(pd.x, py + pd.r * 0.35, pd.r * 1.05, pd.r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.restore();
    const g = ctx.createRadialGradient(pd.x - pd.r * 0.3, py - pd.r * 0.3, 4,
                                       pd.x, py, pd.r);
    g.addColorStop(0, "rgb(36,86,58)");
    g.addColorStop(1, "rgb(14,44,30)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(pd.x, py, pd.r, pd.r * 0.62, 0, 0, Math.PI * 2);
    ctx.fill();
    // small notch
    ctx.fillStyle = "rgba(6,22,16,0.85)";
    ctx.beginPath(); ctx.moveTo(pd.x, py);
    ctx.lineTo(pd.x + pd.r * 0.55, py - pd.r * 0.16);
    ctx.lineTo(pd.x + pd.r * 0.55, py + pd.r * 0.08);
    ctx.closePath(); ctx.fill();
  }

  // reeds: dark tapered silhouettes swaying at the edges
  ctx.fillStyle = "rgb(10,22,28)";
  for (const r of reeds) {
    const tipX = r.x + r.lean * r.h + 8 * Math.sin(t * 0.7 + r.ph);
    const wBase = 7, wTip = 1.5;
    ctx.beginPath();
    ctx.moveTo(r.x - wBase, H);
    ctx.quadraticCurveTo(r.x - wBase * 0.4, H - r.h * 0.6, tipX - wTip, H - r.h);
    ctx.lineTo(tipX + wTip, H - r.h);
    ctx.quadraticCurveTo(r.x + wBase * 0.4, H - r.h * 0.6, r.x + wBase, H);
    ctx.closePath(); ctx.fill();
    // seed head
    ctx.beginPath(); ctx.ellipse(tipX, H - r.h - 8, 5, 14, 0, 0, Math.PI * 2); ctx.fill();
  }
}
</script>
</body></html>
