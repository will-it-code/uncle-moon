<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ep1 S4 — The Baby Bird (Uncle Moon watches)</title>
<!--
  EP1 S4 · the baby bird — full VO version (21.864s)
  ----------------------------------------------------------------------------
  VISUAL GRAMMAR LAW: Uncle Moon in EVERY frame, watching from the sky.

  VO beat sheet (s4_bird.mp3, 21.864s):
    0.00- 3.10  "High in the old oak, a baby bird is crying."   bird-afraid
    3.10- 4.91  "He is afraid of the dark."                     (trembling)
    4.91- 8.59  "Pippa flies up, up, up, and hovers..."          pippa-rises
    8.59-13.13  "Do not be afraid, she whispers..."              pippa-hovers
   13.13-16.09  "The baby bird watches her little light..."     bird-watches
   16.09-17.97  "and his eyes grow heavy..."                    bird-sleeps
   17.97-18.98  "and he sleeps."                                (asleep)
   18.98-21.86  "But Pippa's glow is a little dimmer now."      pippa-dims

  P0 craft: ANTICIPATION = Pippa's glow brightens (3.9-4.9s) BEFORE she
  rises. SECONDARY = nest twigs settle, leaves rustle then still, the
  bird's breathing visibly slows as he calms. Pippa flies in an ARC.
  Camera: ONE move - a slow breathing push-in across the whole scene.

  Architecture: v3 pattern. p5.js draws; ONE paused GSAP timeline owns
  time. window.__seek(t) renders one deterministic frame. ?t= stills,
  ?clean=1 hides hint. No wall-clock, no unseeded random, noiseSeed fixed.
-->
<script src="vendor/p5.min.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="cast/common.js"></script>
<script src="cast/uncle-moon.js"></script>
<script src="cast/pippa.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #070818; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; box-shadow: 0 0 80px rgba(40,40,90,.55); }
  #hint {
    position: fixed; left: 12px; bottom: 10px; color: #8f93c9;
    font: 12px/1.5 system-ui, sans-serif; opacity: .75; user-select: none;
  }
</style>
</head>
<body>
<div id="hint">ep1 s4 · the baby bird &nbsp;—&nbsp; add <b>?t=5.0</b> for a still frame</div>
<script>
"use strict";

/* ================= CONFIG ================= */
const W = 1280, H = 720;
const SEED = 20261016;
const SCENE_LEN = 21.864;   // EXACT s4_bird.mp3 duration

const SKY_STOPS = [
  [0.00, [  7,   8,  24]],
  [0.45, [ 18,  21,  58]],
  [0.75, [ 36,  29,  94]],
  [1.00, [ 59,  42, 114]],
];

const MOON_SPOT = { x: 1060, y: 165, s: 0.5 };
const NEST = { x: 430, y: 505 };
const BIRD = { x: 430, y: 468 };

// Pippa's arc: rises from the meadow corner up to the nest
const FLIGHT = {
  p0: { x: 1150, y: 630 },   // resting in the grass, visible
  p1: { x:  880, y: 280 },   // arc control point
  p2: { x:  548, y: 338 },   // hover beside the nest
};

/* ================= SEEDED RNG ================= */
const rng = castMulberry32(SEED);
const rr = (lo, hi) => lo + rng() * (hi - lo);

/* ================= PARAMS ================= */
const PARAMS = new URLSearchParams(location.search);
const _tq = PARAMS.get("t");
const T_FIXED = (_tq !== null && _tq !== "" && !isNaN(parseFloat(_tq))) ? parseFloat(_tq) : null;
if (PARAMS.has("clean")) document.getElementById("hint").style.display = "none";

/* ================= TIMELINE STATE ================= */
const state = { T: 0 };
const cam = { x: 0, y: 0, zoom: 1 };               // ONE camera move per scene
const moonState = { breath: -1, bobY: 9, glowPulse: 0.9, blink: 1 };
const flight = { p: 0 };                          // 0..1 along the arc
const pippaState = { glow: 0.7, wash: 0 };
const birdState = { tremble: 1, calm: 0 };
const nestState = { settle: 0 };                  // secondary: twigs settle

let tl = null;

function qbez(p0, p1, p2, t) {
  const u = 1 - t;
  return {
    x: u*u*p0.x + 2*u*t*p1.x + t*t*p2.x,
    y: u*u*p0.y + 2*u*t*p1.y + t*t*p2.y,
  };
}
function qbezTan(p0, p1, p2, t) {
  const u = 1 - t;
  return {
    x: 2*u*(p1.x - p0.x) + 2*t*(p2.x - p1.x),
    y: 2*u*(p1.y - p0.y) + 2*t*(p2.y - p1.y),
  };
}

function buildTimeline() {
  tl = gsap.timeline({ paused: true });
  tl.to(state, { T: SCENE_LEN, duration: SCENE_LEN, ease: "none" }, 0);

  // CAMERA: one breathing push-in for the whole scene (1.0 -> 1.05)
  tl.to(cam, { zoom: 1.05, duration: SCENE_LEN, ease: "sine.inOut" }, 0);

  // Uncle Moon's ambient life
  const br = gsap.timeline({ repeat: 4000, yoyo: true });
  br.to(moonState, { breath: 1, duration: 4.5 / 2, ease: "sine.inOut" });
  tl.add(br, 0);
  const bl = gsap.timeline({ repeat: 4000 });
  bl.to(moonState, { blink: 1, duration: 4.3 - 0.16, ease: "none" })
    .to(moonState, { blink: 0.15, duration: 0.08, ease: "power2.in" })
    .to(moonState, { blink: 1, duration: 0.08, ease: "power2.out" });
  tl.add(bl, 0);
  const bb = gsap.timeline({ repeat: 4000, yoyo: true });
  bb.fromTo(moonState, { bobY: 9 }, { bobY: -9, duration: 6 / 2, ease: "sine.inOut" });
  tl.add(bb, 0);
  const gl = gsap.timeline({ repeat: 4000, yoyo: true });
  gl.fromTo(moonState, { glowPulse: 0.8 }, { glowPulse: 1.0, duration: 4.5 / 2, ease: "sine.inOut" });
  tl.add(gl, 0);

  // THE STORY
  const story = gsap.timeline();
  story.addLabel("bird-afraid", 0);

  // ANTICIPATION: her glow brightens a beat BEFORE she rises
  story.addLabel("pippa-anticipates", 3.9);
  story.to(pippaState, { glow: 1.15, duration: 1.0, ease: "sine.inOut" }, 3.9);

  // she rises in an ARC
  story.addLabel("pippa-rises", 4.91);
  story.to(flight, { p: 1, duration: 3.68, ease: "sine.inOut" }, 4.91);

  // hovering beside the nest, light washing over it
  story.addLabel("pippa-hovers", 8.59);
  story.to(pippaState, { wash: 1, duration: 1.6, ease: "sine.out" }, 8.59);
  story.to(pippaState, { glow: 1.05, duration: 1.2, ease: "sine.inOut" }, 8.59);
  story.to(nestState, { settle: 1, duration: 2.0, ease: "sine.out" }, 8.59);

  // the bird watches, fear melting
  story.addLabel("bird-watches", 13.13);
  story.to(birdState, { tremble: 0.08, duration: 1.6, ease: "power2.out" }, 13.13);
  story.to(birdState, { calm: 1, duration: 2.4, ease: "sine.inOut" }, 13.13);

  story.addLabel("bird-sleeps", 16.09);
  // (calm=1 carries the closed eyes + slowed breathing)

  // her glow dims a little
  story.addLabel("pippa-dims", 18.98);
  story.to(pippaState, { glow: 0.72, duration: 2.88, ease: "sine.inOut" }, 18.98);

  tl.add(story, 0);
}

window.__seek = function (t) {
  if (!tl) return;
  tl.seek(Math.max(0, Math.min(t, SCENE_LEN - 0.01)));
  renderFrame();
  window.__frameReady = true;
};

/* ================= WORLD (seeded, built once) ================= */
let stars = [], motes = [], nebulae = [], leaves = [];
let skyGrad = null;

function buildWorld() {
  for (let i = 0; i < 230; i++) {
    const tintRoll = rng();
    stars.push({
      x: rr(0, W), y: rr(0, H * 0.94), r: rr(0.6, 2.8),
      baseA: rr(0.30, 1.0), speed: rr(0.4, 2.4), phase: rr(0, Math.PI * 2),
      col: tintRoll < 0.8 ? [255, 255, 255]
         : tintRoll < 0.9 ? [255, 220, 180] : [180, 200, 255],
      sparkle: rng() < 0.06,
    });
  }
  for (let i = 0; i < 34; i++) {
    motes.push({ x: rr(0, W), y0: rr(0, H), vy: rr(6, 20), s: rr(2, 5),
                 a: rr(0.08, 0.20), phase: rr(0, Math.PI * 2) });
  }
  nebulae = [
    { x: 300,  y: 200, r: 380, col: [120, 100, 220], a: 0.14, ph: 0.0 },
    { x: 1000, y: 480, r: 420, col: [ 80, 140, 180], a: 0.10, ph: 2.1 },
    { x: 640,  y: 620, r: 460, col: [200, 110, 160], a: 0.08, ph: 4.2 },
  ];
  // oak leaves (secondary action: they rustle, then still as calm spreads)
  for (let i = 0; i < 14; i++) {
    leaves.push({ x: rr(60, 420), y: rr(430, 560), s: rr(26, 44),
                  ph: rr(0, Math.PI * 2), rot: rr(-0.4, 0.4) });
  }
}

/* ================= P5 LIFECYCLE ================= */
let liveT = 0;

function setup() {
  createCanvas(W, H);
  pixelDensity(1);
  noiseSeed(SEED);
  buildWorld();
  skyGrad = castLinGrad(window, 0, 0, 0, H, SKY_STOPS);
  buildTimeline();
  if (T_FIXED !== null) { window.__seek(T_FIXED); noLoop(); }
}

function draw() {
  if (T_FIXED !== null) return;
  liveT += Math.min(deltaTime, 100) / 1000;
  window.__seek(liveT % SCENE_LEN);
}

function applyCamera() {
  translate(W / 2, H / 2);
  scale(cam.zoom);
  translate(-W / 2 + cam.x, -H / 2 + cam.y);
}

function renderFrame() {
  const t = state.T;

  push();
  applyCamera();

  drawSky();
  drawNebulae(t);
  drawStars(t);
  drawShootingStar(t);

  // THE LAW: Uncle Moon in every frame, watching from the sky
  drawUncleMoon(window, MOON_SPOT.x, MOON_SPOT.y, MOON_SPOT.s, t,
    { breath: moonState.breath, bobY: moonState.bobY,
      glowPulse: moonState.glowPulse, blink: moonState.blink,
      greetGlow: 1, tilt: -0.05, skyFill: skyGrad });

  drawOak(t);
  drawNest();
  drawBird(t);

  // Pippa: along her arc, or hovering beside the nest
  const bp = qbez(FLIGHT.p0, FLIGHT.p1, FLIGHT.p2, flight.p);
  const tan = qbezTan(FLIGHT.p0, FLIGHT.p1, FLIGHT.p2, flight.p);
  const flying = flight.p > 0.001 && flight.p < 0.999;
  const lean = flying ? 0.35 * Math.atan2(tan.y, tan.x) * 0.5 : 0;
  const hoverY = bp.y + 8 * Math.sin((Math.PI * 2 * t) / 2.4);
  if (pippaState.wash > 0.01) {
    castRadialGlow(window, NEST.x, NEST.y - 60, 320, [255, 214, 130],
                   0.30 * pippaState.wash);
  }
  drawPippa(window, bp.x, hoverY, 1.0, t,
    { glow: pippaState.glow,
      tilt: lean + 0.12 * Math.sin((Math.PI * 2 * t) / 3.6) });

  drawDust(t);
  pop();

  drawVignette();   // screen space, outside the camera
}

/* ================= SKY LAYERS ================= */
function drawSky() {
  const ctx = drawingContext;
  ctx.fillStyle = skyGrad;
  ctx.fillRect(-200, -200, W + 400, H + 400);   // overdraw for the camera
}
function drawNebulae(t) {
  for (const n of nebulae) {
    const x = n.x + 90 * (noise(n.ph, t * 0.015) - 0.5) * 2;
    const y = n.y + 45 * (noise(n.ph + 90, t * 0.012) - 0.5) * 2;
    castRadialGlow(window, x, y, n.r, n.col, n.a);
  }
}
function drawStars(t) {
  const ctx = drawingContext;
  noStroke();
  for (const s of stars) {
    const dx = 14 * (noise(s.phase, t * 0.010) - 0.5) * 2;
    const dy = 10 * (noise(s.phase + 40, t * 0.008) - 0.5) * 2;
    const tw = 0.55 + 0.45 * Math.sin(Math.PI * 2 * t * s.speed + s.phase);
    const wander = 0.80 + 0.40 * noise(s.phase + 80, t * 0.05);
    const a = s.baseA * tw * wander;
    ctx.fillStyle = `rgba(${s.col[0]},${s.col[1]},${s.col[2]},${a.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(s.x + dx, s.y + dy, s.r, 0, Math.PI * 2); ctx.fill();
    if (s.sparkle && tw > 0.92) {
      const L = s.r * 5 * (tw - 0.92) / 0.08;
      stroke(255, 255, 255, 160 * a); strokeWeight(1.2);
      line(s.x + dx - L, s.y + dy, s.x + dx + L, s.y + dy);
      line(s.x + dx, s.y + dy - L, s.x + dx, s.y + dy + L);
      noStroke();
    }
  }
}
function drawShootingStar(t) {
  const cyc = t % 8;
  if (cyc < 2.5 || cyc > 3.5) return;
  const p = (cyc - 2.5);
  const hx = 1080 - 340 * p, hy = 80 + 190 * p;
  const ctx = drawingContext;
  const tx2 = hx + 340 * 0.30, ty2 = hy - 190 * 0.30;
  const lg = ctx.createLinearGradient(hx, hy, tx2, ty2);
  lg.addColorStop(0, "rgba(255,246,224,0.9)");
  lg.addColorStop(1, "rgba(255,246,224,0)");
  ctx.strokeStyle = lg; ctx.lineCap = "round";
  ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx2, ty2); ctx.stroke();
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx2, ty2); ctx.stroke();
  castRadialGlow(window, hx, hy, 26, [255, 246, 224], 0.8);
}
function drawDust(t) {
  for (const m of motes) {
    let y = (m.y0 - t * m.vy) % (H + 60);
    if (y < 0) y += H + 60;
    y -= 30;
    const x = m.x + 40 * (noise(m.phase, t * 0.06) - 0.5) * 2;
    castRadialGlow(window, x, y, m.s * 2.4, [255, 240, 210], m.a);
  }
}
function drawVignette() {
  const ctx = drawingContext;
  const g = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.95);
  g.addColorStop(0, "rgba(4,5,16,0)");
  g.addColorStop(1, "rgba(4,5,16,0.45)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ================= SET: the old oak ================= */
function drawOak(t) {
  const calm = birdState.calm;
  // gnarled old branch reaching in from the left
  noFill();
  stroke(88, 62, 42); strokeWeight(34); strokeCap(ROUND);
  bezier(-60, 600, 140, 560, 300, 528, 445, 508);
  stroke(74, 52, 36); strokeWeight(20);
  bezier(60, 590, 180, 560, 300, 536, 420, 516);
  noStroke();
  // sleepy leaf clusters (secondary: rustle while the bird is afraid,
  // then settle as calm spreads)
  const rustle = (1 - calm * 0.85);
  noStroke();
  for (const lf of leaves) {
    const sway = rustle * 5 * Math.sin((Math.PI * 2 * t) / 1.7 + lf.ph);
    push();
    translate(lf.x + sway, lf.y + sway * 0.5);
    rotate(lf.rot + rustle * 0.08 * Math.sin((Math.PI * 2 * t) / 2.3 + lf.ph));
    fill(44, 84, 58);
    ellipse(0, 0, lf.s, lf.s * 0.45);
    fill(56, 100, 68);
    ellipse(-lf.s * 0.12, -lf.s * 0.08, lf.s * 0.6, lf.s * 0.28);
    pop();
  }
}

function drawNest() {
  const nx = NEST.x, ny = NEST.y;
  // secondary: the twigs "sigh" and settle as Pippa's light arrives
  const s = 1 - 0.03 * nestState.settle;
  push();
  translate(nx, ny);
  scale(s, 2 - s);
  translate(-nx, -ny);
  noStroke();
  fill(96, 70, 48);  ellipse(nx, ny, 200, 74);
  fill(78, 56, 38);  ellipse(nx, ny - 12, 168, 58);
  fill(56, 40, 28);  ellipse(nx, ny - 22, 126, 40);
  stroke(72, 52, 36); strokeWeight(4); strokeCap(ROUND);
  for (let i = 0; i <= 10; i++) {
    const a = Math.PI * (0.05 + 0.90 * i / 10);
    const rx = 92, ry = 34;
    const x1 = nx - rx * Math.cos(a), y1 = ny - 8 - ry * Math.sin(a);
    line(x1 - 14, y1 + 4, x1 + 14, y1 - 6);
  }
  noStroke();
  pop();
}

/* ================= BABY BIRD ================= */
function drawBird(t) {
  const bx = BIRD.x, by = BIRD.y;
  const tr = birdState.tremble;
  const calm = birdState.calm;
  const jx = tr * 2.4 * Math.sin(t * 43);
  const jy = tr * 1.6 * Math.cos(t * 37);
  // secondary: his breathing visibly SLOWS as he calms
  const bPeriod = 2.2 + 2.0 * calm;
  const breathe = 1 + 0.022 * Math.sin((Math.PI * 2 * t) / bPeriod);

  push();
  translate(bx + jx, by + jy);
  scale(breathe, 2 - breathe);

  // fluffy round body
  noStroke();
  fill(168, 186, 218);
  circle(-15, 8, 54); circle(15, 8, 54); circle(0, -10, 58);
  fill(208, 218, 240);
  ellipse(0, 16, 54, 44);
  fill(140, 160, 198);
  ellipse(-28, 10, 24, 36);
  ellipse(28, 10, 24, 36);
  stroke(168, 186, 218); strokeWeight(5); strokeCap(ROUND);
  line(-7, -34, -13, -48);
  line(5, -35, 9, -50);
  line(0, -34, 0, -46);
  noStroke();
  // beak: slightly open while crying, soft closed smile as he calms
  fill(245, 183, 120);
  const beakOpen = 9 * (1 - calm) + 2;
  triangle(-8, -4, 8, -4, 0, -4 + beakOpen);

  // eyes: big and round while afraid, soft closed arcs in sleep
  const eyeY = -16;
  if (calm < 0.5) {
    const bp = qbez(FLIGHT.p0, FLIGHT.p1, FLIGHT.p2, flight.p);
    const gx = Math.max(-5, Math.min(5, (bp.x - bx) * 0.012));
    const gy = Math.max(-4, Math.min(4, (bp.y - by) * 0.012));
    fill(255, 255, 255);
    circle(-16, eyeY, 27); circle(16, eyeY, 27);
    fill(48, 44, 62);
    circle(-16 + gx, eyeY + gy, 13); circle(16 + gx, eyeY + gy, 13);
    fill(255, 255, 255);
    circle(-18 + gx, eyeY - 3 + gy, 4.5); circle(14 + gx, eyeY - 3 + gy, 4.5);
  } else {
    noFill();
    stroke(70, 64, 88); strokeWeight(5); strokeCap(ROUND);
    arc(-16, eyeY, 27, 17, Math.PI * 0.15, Math.PI * 0.85);
    arc(16, eyeY, 27, 17, Math.PI * 0.15, Math.PI * 0.85);
    noStroke();
  }

  // one small tear while crying, fading as comfort arrives
  const tearA = 0.8 * (1 - calm);
  if (tearA > 0.03) {
    const ctx = drawingContext;
    ctx.fillStyle = `rgba(170,200,255,${tearA.toFixed(3)})`;
    ctx.beginPath();
    ctx.ellipse(-30, 2 + 6 * ((t * 0.7) % 1), 4, 7, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  castRadialGlow(window, -27, 2, 9, [255, 150, 150], 0.45);
  castRadialGlow(window, 27, 2, 9, [255, 150, 150], 0.45);

  pop();
}
</script>
</body>
